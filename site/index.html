<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hadaway — Command Center</title>
<style>
:root{--bg:#f5f5f7;--card:#ffffff;--ink:#1d1d1f;--sub:#6e6e73;--line:#e5e5ea;--blue:#0071e3;--green:#34c759;--red:#ff3b30;--orange:#ff9500}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);z-index:10}
.nav{max-width:1080px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:14px 20px;flex-wrap:wrap}
.logo{font-weight:700;font-size:15px;margin-right:16px}
.tab{padding:7px 14px;border-radius:980px;font-size:13px;color:var(--sub);cursor:pointer;border:none;background:transparent;font-family:inherit;transition:all .2s}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--blue);color:#fff}
main{max-width:1080px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:40px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.sub{color:var(--sub);font-size:17px;margin-top:8px}
.section{display:none;margin-top:32px}
.section.active{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px;margin-top:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border-radius:18px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h3{font-size:13px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.green{color:var(--green)}.red{color:var(--red)}.orange{color:var(--orange)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--sub);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:3px 10px;border-radius:980px;font-size:12px;font-weight:600}
.p-g{background:#e8f7ec;color:#1e7c33}.p-o{background:#fff3e0;color:#a05c00}.p-b{background:#e5f0ff;color:#0b62c9}.p-r{background:#ffe8e6;color:#c02b20}
.tag{display:inline-block;background:#f0f0f2;border-radius:8px;padding:4px 10px;font-size:13px;margin:3px 4px 3px 0}
.pre{white-space:pre-wrap;font-size:14px;line-height:1.6;color:var(--ink);background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:16px}
.note{font-size:13px;color:var(--sub);margin-top:6px}
footer{text-align:center;font-size:12px;color:var(--sub);padding:24px}
a{color:var(--blue);text-decoration:none}
details{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:8px 0;background:var(--card)}
details summary{font-weight:600;cursor:pointer;font-size:14px}
details p{font-size:14px;color:#3a3a3c;margin-top:8px}
</style>
</head>
<body>
<header><nav class="nav">
  <span class="logo">⌂ Hadaway Command</span>
  <button class="tab active" data-s="overview">Overview</button>
  <button class="tab" data-s="finance">Finance</button>
  <button class="tab" data-s="channels">Channels</button>
  <button class="tab" data-s="outreach">Outreach</button>
  <button class="tab" data-s="copy">Ad Copy</button>
  <button class="tab" data-s="sprint">Sprint</button>
</nav></header>
<main>

<section id="overview" class="section active"></section>
<section id="finance" class="section"></section>
<section id="channels" class="section"></section>
<section id="outreach" class="section"></section>
<section id="copy" class="section"></section>
<section id="sprint" class="section"></section>

</main>
<footer>1244 Hadaway Ct NE · Lawrenceville GA 30043 · data generated from campaign database</footer>
<script src="data.js"></script>
<script>
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById(t.dataset.s).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}));
const P=DATA.property, F=DATA.finance, C=DATA['channel-plan'], T=DATA['outreach-targets'], A=DATA['ad-copy'], S=DATA['sprint-log'], PT=DATA['post-targets'], PS=DATA.personas;
const fmt=n=>'$'+Number(n).toLocaleString();
</script>
<script src="tabs.js"></script>
</body>
</html>
